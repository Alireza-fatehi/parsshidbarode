name: Build Parsshid APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip ParsshidBarcodeAndroid.zip

      - name: Build APK
        run: cd ParsshidBarcodeAndroid && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ParsshidBarcode-APK
          path: ParsshidBarcodeAndroid/app/build/outputs/apk/debug/app-debug.apk
